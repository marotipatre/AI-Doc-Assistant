name: repolens

x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://repolens:${POSTGRES_PASSWORD:-repolens_local}@postgres:5432/repolens
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

services:
  web:
    build: .
    environment:
      FASTAPI_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment: *api-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repolens_local}
      POSTGRES_DB: repolens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
